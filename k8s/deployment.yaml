apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-backend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot-backend
  template:
    metadata:
      labels:
        app: chatbot-backend
    spec:
      containers:
        - name: chatbot-backend
          image: 986611521344.dkr.ecr.ap-northeast-2.amazonaws.com/chatbot/backend:9f76060e8cc84382780ac83f69b5c2c1ffcde963
          imagePullPolicy: Always
          ports:
            - containerPort: 8282
