apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-frontend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot-frontend
  template:
    metadata:
      labels:
        app: chatbot-frontend
    spec:
      containers:
        - name: chatbot-frontend
          image: 986611521344.dkr.ecr.ap-northeast-2.amazonaws.com/chatbot/frontend:4516250f87904be482f43b756e2e7a419700e6a5
          ports:
            - containerPort: 5173
