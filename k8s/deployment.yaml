apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-frontend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot-frontend
  template:
    metadata:
      labels:
        app: chatbot-frontend
    spec:
      containers:
        - name: chatbot-frontend
          image: 986611521344.dkr.ecr.ap-northeast-2.amazonaws.com/chatbot/frontend:2967907a98c2cbb8f2587a995d78b74b399fba2c
          ports:
            - containerPort: 5173
