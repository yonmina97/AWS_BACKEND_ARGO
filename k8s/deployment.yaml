apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-backend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot-backend
  template:
    metadata:
      labels:
        app: chatbot-backend
    spec:
      containers:
        - name: chatbot-backend
          image: $IMAGE_URI
          imagePullPolicy: Always
          ports:
            - containerPort: 8282
